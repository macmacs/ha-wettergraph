[project]
name = "wettergraph-ha"
version = "0.2.0"
description = "Wettergraph image renderer, served as a Home Assistant app"
requires-python = ">=3.14"
dependencies = [
    "resvg-py==0.5.0",
]

[tool.uv]
# Alpine's community repo ships uv, but it is built against that Alpine's musl;
# keep uv from silently provisioning its own Python for anything it runs here.
python-preference = "only-system"
