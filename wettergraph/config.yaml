name: Wettergraph
version: "0.5.1"
slug: wettergraph
description: >-
  Renders a Wettergraph-style forecast image for one place - temperature curve,
  weather icons, precipitation band, no wind - from met.no data, and serves it
  as a PNG that a Home Assistant generic camera can poll.
url: https://github.com/macmacs/ha-wettergraph
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Two mapped folders, two delivery routes.
#
# share (ticket 06) is the camera fallback: when the HA instance cannot reach
# this app's port, HA still reads a file, so the graph is also written to
# /share/wettergraph/graph.png for the Local file camera.
#
# homeassistant_config (ticket 07) is the *dashboard* route, and it is not
# optional: a browser-loaded card cannot use port 8099 at all, because the
# dashboard is HTTPS and the port is HTTP, so the image is blocked as mixed
# content. HA serves its own config dir's `www` folder at /local/, so the SVGs
# go to www/wettergraph/graph-{light,dark}.svg and the card reads a same-origin
# URL that never rotates. Note the mount point: Supervisor mounts every map
# type at /<type-name>, so HA's config dir is /homeassistant - /config inside
# an app container is the app's *own* public config folder, not HA's.
map:
  - share:rw
  - homeassistant_config:rw
# The base image brings its own init (s6-overlay) and refuses to run unless it
# is PID 1. Supervisor's `init` key defaults to true, which hands the container
# to Docker's tini as PID 1 instead, and s6 then dies with
# "s6-overlay-suexec: fatal: can only run as pid 1".
init: false
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Status page and graph image (polled by the generic camera)
watchdog: tcp://[HOST]:[PORT:8099]/health
webui: http://[HOST]:[PORT:8099]/
ingress: true
ingress_port: 8099
panel_icon: mdi:weather-partly-cloudy
panel_title: Wettergraph
options:
  page_note: "setup probe"
  place_id: "2-6325496"
  latitude: 48.1746
  longitude: 11.5538
  update_interval: 15
  image_width: 794
  image_theme: light
schema:
  page_note: str
  place_id: str
  latitude: float(-90,90)
  longitude: float(-180,180)
  update_interval: int(5,180)
  # The two knobs the served image follows when the URL asks for nothing
  # (graph-spec §1.2 clamps, §2.2 falls back to light). A dashboard URL can
  # still override both per request.
  image_width: int(560,1588)
  image_theme: list(light|dark)
